name: Dependency Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: 依存関係の脆弱性を検査
    runs-on: ubuntu-latest
    steps:
      - name: 依存関係の変更を検査
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
